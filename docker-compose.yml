services:
  ollama:
    image: ollama/ollama:latest
    container_name: qwen-ollama
    restart: unless-stopped
    ports:
      - "192.168.0.111:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_LOADED_MODELS: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "test -e /dev/nvidiactl && ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qwen-pull:
    image: ollama/ollama:latest
    container_name: qwen-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${QWEN_MODEL:-qwen3:30b}"]
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

  qwen-hybrid-smoke:
    image: ollama/ollama:latest
    container_name: qwen-hybrid-smoke
    depends_on:
      qwen-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:30b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama run "$$QWEN_MODEL" "Reply with OK only." >/tmp/qwen-smoke.out
        ollama ps
        ollama ps | awk -v model="$$QWEN_MODEL" '$$1 == model { found=1; if ($$0 ~ /GPU/ && $$0 !~ /100% CPU/) ok=1 } END { exit(found && ok ? 0 : 1) }'
    restart: "no"

volumes:
  ollama-models:
